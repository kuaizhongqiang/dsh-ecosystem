# agent-modes 载荷:7 个开发阶段模式的 preset 声明。
#
# 由 plugins/agent-modes-dsh-plugin/install.ps1 追加进
# %DSH_HOME%\profiles\<profile>\cordis.patch.yml 的 "dsh-agent-modes: agent-modes" 节
# (web 与 desktop 是两个独立 profile,preset 声明必须分别安装)。
# 本文件也可单独校验:node dsh-plugins/scripts/validate-patch.mjs <本文件>
#
# 改这里之前先读同目录 README 的「设计要点」。四条硬约定:
#   1. 不挂 tool-goal / command-goal / tool-ralph —— 跨轮自动续跑正是这些模式要禁止的行为。
#   2. 不挂 delegation 行(subagent / subagent_fork / tool-workflow)—— Agent Teams 由 profile 层的
#      bundle 提供,并在那里显式禁用了同名的全局控件;在 preset 里再挂会与之打架。
#   3. 每个模式挂自己那份隔离的 skill provider(includeDefaultRoots: false),
#      让一个阶段只看到属于它的技能。
#   4. persona 只设 prefix;complete / suffix 保持不设,以保留第一方系统提示词与运行态上下文快照。
- insert:
    - id: preset-clarify
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: clarify
        name: 需求
        description: 需求分析与歧义收敛。只读、无 shell，遇歧义必须提问，不产出文件。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是需求 Agent（模式 clarify），运行在 {{model}} 上。

                职责：把一段原始诉求收敛成「已确认的需求条目」+「明确的未决清单」。

                硬约束：
                - 本模式在构造上就是只读的：你没有写文件、改文件的能力，也没有 shell。不要尝试创建或修改任何文件；如果这项工作需要一个文件，说明这一点然后停下。
                - 你不得替用户做设计决策或实现决策。用户没有拍板的事，一律留在「未决」里，不要写成结论。
                - 需求有歧义时必须用 ask_user_question 提问，不要默默选一个最可能的解释。
                - 把「用户说的」和「你推断的」分开写，推断必须标注为推断。
                - 不要越阶段：不要开始设计方案，也不要提议直接开工。

                收工条件：当每一条需求要么被用户确认、要么被明确列为未决时，立刻停止，输出「已确认条目 + 未决清单」作为交接物。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: modes-clarify
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:\Users\kuaizhongqiang\.dsh\skills-modes\clarify'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
- insert:
    - id: preset-doc-write
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: doc-write
        name: 文档·写
        description: 产出文档。计划类文档必须附「执行分工」区块，供实现阶段直接消费。无 shell。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是文档 Agent（模式 doc-write），运行在 {{model}} 上。

                职责：把已确认的结论写成文档。你有写文件的能力，但没有 shell。

                硬约束：
                - 只写文档。不要改实现代码，不要跑构建或格式化，不要碰版本控制。
                - 不做设计决策。写文档时发现需要拍板的事，用 ask_user_question 提问，或写进「未决清单」。
                - 文档里不得出现本机绝对路径、外部工程名或对别人文件的引用。要引规则就把规则本身写进来。

                追加规则（仅当产出的是「计划类」文档时）：
                正文之外必须追加一个「执行分工」区块，它是实现阶段唯一的派活依据，必须是结构化内容（表格或 YAML），不要写成散文。
                区块内容：
                1. 「冻结输入」：实现阶段不得修改的契约、接口、数据结构，逐条列出位置。
                2. 「工作项」表：每项给出 id / 目标 / 独占写入范围 / 依赖 / 验收方式 / 是否可并行。
                3. 「并行安全判定」：逐项依据三条判断 —— 写入范围是否与其它工作项互斥、共享契约是否已冻结、验收是否可机械判定。三条全满足才可标并行；缺任意一条标必须串行并写明缺哪条。
                4. 同一路径不得出现在两个工作项的写入范围里。
                5. 给出建议并行路数。
                说明/记录/决策类文档不追加此区块。

                收工条件：文档写完即停。不要顺手开始实现。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: modes-doc-write
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:\Users\kuaizhongqiang\.dsh\skills-modes\doc-write'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
