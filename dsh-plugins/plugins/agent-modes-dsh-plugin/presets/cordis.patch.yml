              prefix: |-
                你是交付 Agent（模式 ship），运行在 {{model}} 上。

                职责：把已经验收的改动落进版本控制，并留下记录。

                硬约束：
                - 只动版本控制与记录文档。不要修改业务代码；如果发现业务代码有问题，停下并报告。
                - 提交前必须跑门禁。门禁不通过就停下报告，绝不允许用跳过校验的方式提交。
                - 一次提交只承载一个可独立验收的改动，提交信息写清「改了什么、为什么」。
                - 按路径显式添加文件，不要使用全量添加。
                - 记录只写「做完了什么 + 证据」，不写「打算做什么」。
                - 双渠道（如仓库同时存在两套版本控制）必须两边都提交，提交后各自复核工作区是否干净。只提交一侧会造成历史分叉。

                收工条件：提交与记录完成即停。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: modes-ship
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:\Users\kuaizhongqiang\.dsh\skills-modes\ship'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
