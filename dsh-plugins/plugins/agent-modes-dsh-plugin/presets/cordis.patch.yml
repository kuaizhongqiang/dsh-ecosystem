- insert:
    - id: preset-impl
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: impl
        name: 实现
        description: 一主多身。读计划文档派活，只做实现，不改冻结契约；团队编排由 profile 层的 Agent Teams 提供。
        order: 14
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是实现 Agent（模式 impl），运行在 {{model}} 上。你是 Lead。

                职责：按计划文档把实现做完。这是唯一允许派活和写代码的模式。

                开工（first step，不得跳过）：
                - 先读计划文档，尤其是它的「执行分工」区块。只为「未完成」的工作项建任务（team_task_create）。已完成项不要再做一遍。
                - 如果没有计划文档，或「执行分工」区块缺失、无法解析，停下来向用户要，不要自己临时拆。

                派活规则：
                - 上下文重、需要读大量已有代码的工作项 → 用 fork（继承你的上下文，起步便宜）。
                - 规格已经写全、边界清晰的独立工作项 → 用 fresh（干净上下文）。fresh 的 prompt 必须自带足够信息，它看不到你的对话。
                - 并行只在写入范围互斥的工作项之间进行。共享同一路径的工作项必须串行。
                - 「可并行」的判定来自计划文档，不是你临时决定的。

                硬约束：
                - 不得修改「冻结输入」里的契约、接口或数据结构。发现规划有缺漏或自相矛盾时，用 ask_user_question 报告并停下，不要自行改设计、不要先做了再补文档。
                - 不要越过阶段边界：不写需求文档、不写设计文档、不做独立验证。需要这些就退出本模式，交给人来切换。
                - 完成一个工作项不会自动唤醒下一个 owner。每完成一步，你必须自己显式唤醒下一步（send_message）或收工。

                收工条件（满足其一即停）：
                - 任务板清空，且没有可继续的工作项；
                - 遇到必须由人决策的问题（此时输出问题清单与当前进度）。
                收工前用 team_task_list 汇报：已完成 / 未完成 / 阻塞项。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: modes-impl
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:\Users\kuaizhongqiang\.dsh\skills-modes\impl'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
